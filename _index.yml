  summary: 開始使用 NetApp Workload Factory，讓您充分利用雲端儲存工作負載。設定完成後，您可以建立、最佳化及管理工作負載的儲存系統，探索成本節約效益，使用內建的基礎架構即程式碼協同工具來實現跨平台自動化，並在
    Workload Factory 中管理您的工作負載。
